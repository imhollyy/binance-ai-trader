# A separate owner-review preview. Never use the tradepilot_quick project.
# The external Quick Tunnel is started separately only after explicit approval.
services:
  preview-db:
    profiles: ["review"]
    networks: !override [review_private]

  preview-api:
    profiles: ["review"]
    # Override the base preview's 172.30.210.10 proxy trust: this review
    # ingress uses 172.30.220.10. Otherwise HTTPS-only login fails closed.
    command:
      - sh
      - -c
      - >-
        python -m binance_ai_trader.preview_preflight
        && alembic upgrade head
        && exec uvicorn binance_ai_trader.api:app
        --host 0.0.0.0 --port 8000
        --proxy-headers --forwarded-allow-ips 172.30.220.10 --no-access-log
    networks: !override [review_private]

  preview-web:
    profiles: ["review"]
    networks: !override [review_private]

  preview-ingress:
    profiles: ["review"]
    ports:
      - "${PREVIEW_INGRESS_BIND:?Review ingress must bind to loopback}"
    networks: !override
      review_private:
        ipv4_address: 172.30.220.10

networks:
  preview_private: !reset null
  review_private:
    ipam:
      config:
        - subnet: 172.30.220.0/24

# Compose scopes these named volumes by the unique review project name.
