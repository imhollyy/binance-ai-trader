name: CI

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy strict
        run: python -m mypy src tests
      - name: Unit tests
        run: python -m pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trader_test
          POSTGRES_USER: trader_test
          POSTGRES_PASSWORD: ci_only_password_not_a_secret
        ports:
          - 5432:5432
          - 55444:5432
        options: >-
          --health-cmd "pg_isready -U trader_test -d trader_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://trader_test:ci_only_password_not_a_secret@127.0.0.1:5432/trader_test
      TEST_POSTGRES_URL: postgresql+psycopg://trader_test:ci_only_password_not_a_secret@127.0.0.1:5432/trader_test
      PAPER_LEDGER_TEST_ISOLATED: "1"
      TRADING_MODE: paper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply Alembic migration
        run: python -m alembic upgrade head
      - name: Re-run migration idempotently
        run: python -m alembic upgrade head
      - name: PostgreSQL persistence and paper ledger integration
        run: python -m pytest -q tests/test_postgres_integration.py tests/test_paper_ledger_postgres.py

      - name: Create an independent disposable PAPER transaction test database
        env:
          PGPASSWORD: ci_only_password_not_a_secret
        run: |
          psql -h 127.0.0.1 -U trader_test -d trader_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE trader_exec_test'
      - name: Migrate independent PAPER transaction test database
        env:
          DATABASE_URL: postgresql+psycopg://trader_test:ci_only_password_not_a_secret@127.0.0.1:5432/trader_exec_test
        run: python -m alembic upgrade head
      - name: Atomic PAPER execution PostgreSQL tests
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://trader_test:ci_only_password_not_a_secret@127.0.0.1:5432/trader_exec_test
        run: python -m pytest -q tests/test_paper_execution_postgres.py

      - name: Create dedicated disposable PAPER signal test database
