        run: |
          psql -h 127.0.0.1 -U trader_test -d trader_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE trader_signal_test'
      - name: Migrate disposable PAPER signal test database
        env:
          DATABASE_URL: postgresql+psycopg://trader_test:ci_only_password_not_a_secret@127.0.0.1:5432/trader_signal_test
        run: python -m alembic upgrade head
      - name: READ ONLY PAPER Spot signal planning PostgreSQL integration
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://trader_test:ci_only_password_not_a_secret@127.0.0.1:5432/trader_signal_test
        run: python -m pytest -q tests/test_paper_signal_plan_postgres.py

      - name: Create disposable atomic signal execution test database
